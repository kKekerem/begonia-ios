# Redmi Note 8 Pro (begonia / MediaTek MT6785 / Helio G90T) target configuration.
# Hardware values verified against begonia BoardConfig.mk and mt6785.dts / xiaomi-mt6785-common.dtsi.

BOARD=begonia
SOC=mt6785
ARCH=arm64
PARTITION_SCHEME=a-only

# Boot image layout (Android boot image header v2)
BOOT_HEADER_VERSION=2
BOOT_PAGE_SIZE=2048
KERNEL_BASE=0x40078000
KERNEL_OFFSET=0x00008000
KERNEL_LOAD_PA=0x40080000
RAMDISK_OFFSET=0x07c08000
TAGS_OFFSET=0x0bc08000
DTB_OFFSET=0x0bc08000
BOOT_PARTITION_MAX_BYTES=67108864

# Display (default LK continuous splash fallback; overridden at runtime from live DTB/OVL0)
PANEL_WIDTH=1080
PANEL_HEIGHT=2340
FB_FALLBACK_PA=0x7e605000
FB_FALLBACK_SIZE=0x017e8000

# SoC MMIO base addresses (mt6785.dts)
SOC_MMIO_BASE=0x0c000000
SOC_MMIO_SIZE=0x14000000
GICD_BASE=0x0c000000
GICD_SIZE=0x00040000
GICR_BASE=0x0c040000
GICR_SIZE=0x00200000
INT_POL_BASE=0x0c53a650
INT_POL_SIZE=0x00000050

TOPRGU_BASE=0x10007000
PWRAP_BASE=0x1000d000
KEYPAD_BASE=0x10010000
APUART0_BASE=0x11002000
MTU3_MAC_BASE=0x11201000
MTU3_IPPC_BASE=0x11203e00
UFSHCI_BASE=0x11270000
UFSHCI_SIZE=0x00002300
MALI_BASE=0x13040000
MALI_SIZE=0x00010000
DISP_OVL0_BASE=0x14008000
DISP_OVL0_2L_BASE=0x14009000
DISP_RDMA0_BASE=0x1400b000
DISP_MUTEX_BASE=0x14016000

# Architected timer & GIC PPIs (mt6785.dts)
TIMER_FREQ_HZ=13000000
VTIMER_INTID=27
