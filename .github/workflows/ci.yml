name: begonia-ios CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_xnu:
        description: Build XNU-11215 kernel on macOS runner
        type: boolean
        default: true
      kernel_config:
        description: XNU kernel config (DEVELOPMENT or RELEASE)
        type: string
        default: DEVELOPMENT

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  loader-and-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM AArch64 bare-metal tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm

      - name: Build mtkloader and run test suite
        run: |
          chmod +x scripts/build_loader.sh scripts/run_tests.sh
          ./scripts/run_tests.sh

      - name: Upload diagnostic boot image
        uses: actions/upload-artifact@v4
        with:
          name: begonia-mtkloader
          path: |
            build/mtkloader.bin
            build/mtkloader.elf
            build/begonia-diag.img

  xnu-kernel:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.build_xnu) ||
      (github.event_name == 'push' && (
        contains(join(github.event.commits.*.modified, ' '), 'src/xnu/') ||
        contains(join(github.event.commits.*.added, ' '), 'src/xnu/')
      ))
    runs-on: macos-15
    timeout-minutes: 120
    env:
      DXB_REPO: https://github.com/blacktop/darwin-xnu-build
      DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
      BERGAMOTA_REPO: https://github.com/ry-diffusion/Bergamota
      BERGAMOTA_SHA: 37a7a7a917fc09945ed2f7d1ae68b84d4525b4cb
      MACOS_VERSION: "15.3"
      KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
      MACHINE_CONFIG: SWEET
      CCACHE: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: "1"
      CCACHE_MAXSIZE: 2G
      CCACHE_SLOPPINESS: include_file_mtime,include_file_ctime
      CCACHE_COMPILERCHECK: content

    steps:
      - uses: actions/checkout@v4

      - name: Prepare dxb and patch stack
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD

          git init -q bergamota
          git -C bergamota fetch -q --depth 1 "$BERGAMOTA_REPO" "$BERGAMOTA_SHA"
          git -C bergamota checkout -q FETCH_HEAD

          for f in bergamota/xnu/patches-11215/*.patch bergamota/xnu/patches-11215/*.sh; do
            [ -e "$f" ] || continue
            cp "$f" "dxb/patches/15.0/sweet-$(basename "$f")"
          done
          for f in src/xnu/patches-11215/*.patch src/xnu/patches-11215/*.sh; do
            [ -e "$f" ] || continue
            cp "$f" "dxb/patches/15.0/sweet-z-$(basename "$f")"
          done

          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          python3 - <<'PY'
          p = 'dxb/build.sh'
          s = open(p).read()
          needle = '                warning "Skipping patch ${PATCH} (already upstream, previously applied, or malformed): ${APPLY_CHECK}"\n'
          if needle in s:
              s = s.replace(needle, needle + '                case "$(basename "${PATCH}")" in sweet-*) error "patch failed: ${PATCH}"; exit 1 ;; esac\n')
              open(p, 'w').write(s)
          PY

      - name: Install build dependencies and select Xcode 16
        run: |
          brew install jq gum bash cmake ninja ccache
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          XC=$(ls -d /Applications/Xcode_16.2*.app 2>/dev/null | sort -V | tail -1 || true)
          [ -n "$XC" ] || XC=$(ls -d /Applications/Xcode_16.*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: xnu11215-begonia-${{ runner.os }}-${{ env.KERNEL_CONFIG }}-${{ hashFiles('src/xnu/patches-11215/**') }}
          restore-keys: xnu11215-begonia-${{ runner.os }}-${{ env.KERNEL_CONFIG }}-

      - name: Build XNU-11215 kernel
        working-directory: dxb
        run: |
          set +e
          bash build.sh > build.log 2>&1
          rc=$?
          tail -80 build.log
          exit $rc

      - name: Collect kernel artifacts
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          cp dxb/build.log out/build.log 2>/dev/null || true
          (cd out && shasum -a 256 kernel.* > SHA256SUMS 2>/dev/null) || true
          ls -lh out

      - name: Upload XNU kernel artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: begonia-xnu-11215-${{ env.KERNEL_CONFIG }}
          path: out/
          if-no-files-found: warn
